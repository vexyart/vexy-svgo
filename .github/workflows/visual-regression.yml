name: Visual Regression Testing

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'testdata/**'
      - '.github/workflows/visual-regression.yml'

jobs:
  visual-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.74.0
      
      - name: Install resvg for rendering
        run: |
          cargo install resvg --version 0.42.0
      
      - name: Build vexy-svgo
        run: cargo build --release --package vexy-svgo-cli
      
      - name: Create test output directories
        run: |
          mkdir -p visual-test/current
          mkdir -p visual-test/baseline
          mkdir -p visual-test/diff
      
      - name: Optimize SVGs (current version)
        run: |
          for svg in testdata/*.svg; do
            filename=$(basename "$svg")
            ./target/release/vexy-svgo "$svg" -o "visual-test/current/${filename}"
          done
      
      - name: Render current SVGs to PNG
        run: |
          for svg in visual-test/current/*.svg; do
            filename=$(basename "$svg" .svg)
            resvg "$svg" "visual-test/current/${filename}.png"
          done
      
      - name: Checkout base version
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}
      
      - name: Build base vexy-svgo
        run: cargo build --release --package vexy-svgo-cli
      
      - name: Optimize SVGs (base version)
        run: |
          for svg in testdata/*.svg; do
            filename=$(basename "$svg")
            ./target/release/vexy-svgo "$svg" -o "visual-test/baseline/${filename}"
          done
      
      - name: Render baseline SVGs to PNG
        run: |
          for svg in visual-test/baseline/*.svg; do
            filename=$(basename "$svg" .svg)
            resvg "$svg" "visual-test/baseline/${filename}.png"
          done
      
      - name: Install ImageMagick for comparison
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      
      - name: Compare images and generate diff
        id: compare
        continue-on-error: true
        run: |
          DIFF_COUNT=0
          TOTAL_COUNT=0
          
          for baseline_png in visual-test/baseline/*.png; do
            filename=$(basename "$baseline_png")
            current_png="visual-test/current/${filename}"
            diff_png="visual-test/diff/${filename}"
            
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            
            if [ -f "$current_png" ]; then
              compare -metric AE "$baseline_png" "$current_png" "$diff_png" 2> /tmp/diff_count || true
              PIXEL_DIFF=$(cat /tmp/diff_count)
              
              if [ "$PIXEL_DIFF" -gt 0 ]; then
                echo "⚠️  Difference detected in ${filename}: ${PIXEL_DIFF} pixels"
                DIFF_COUNT=$((DIFF_COUNT + 1))
              else
                echo "✅ ${filename}: identical"
              fi
            else
              echo "❌ ${filename}: missing in current version"
              DIFF_COUNT=$((DIFF_COUNT + 1))
            fi
          done
          
          echo "diff_count=${DIFF_COUNT}" >> $GITHUB_OUTPUT
          echo "total_count=${TOTAL_COUNT}" >> $GITHUB_OUTPUT
          
          if [ "$DIFF_COUNT" -gt 0 ]; then
            echo "❌ Visual differences detected in ${DIFF_COUNT}/${TOTAL_COUNT} files"
            exit 1
          else
            echo "✅ All ${TOTAL_COUNT} files visually identical"
          fi
      
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-images
          path: visual-test/diff/*.png
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const diffCount = '${{ steps.compare.outputs.diff_count }}';
            const totalCount = '${{ steps.compare.outputs.total_count }}';
            
            const passed = diffCount === '0';
            const emoji = passed ? '✅' : '⚠️';
            const status = passed ? 'PASSED' : 'DIFFERENCES DETECTED';
            
            let body = `## ${emoji} Visual Regression Test: ${status}\n\n`;
            body += `- **Total files tested**: ${totalCount}\n`;
            body += `- **Files with differences**: ${diffCount}\n\n`;
            
            if (!passed) {
              body += '### Action Required\n';
              body += '1. Download diff images from artifacts\n';
              body += '2. Review visual changes carefully\n';
              body += '3. If changes are intentional, update baseline\n';
              body += '4. If unintentional, fix rendering issues\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
