name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Can add macOS-latest and windows-latest for broader coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --debug

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            target
            fuzz/target
            fuzz/artifacts
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build fuzz targets
        run: cargo fuzz build

      - name: List fuzz targets
        run: cargo fuzz list

      - name: Run fuzz_svg_parser
        run: cargo fuzz run fuzz_svg_parser -- -max_total_time=30 -runs=10000

      - name: Run fuzz_path_parser
        run: cargo fuzz run fuzz_path_parser -- -max_total_time=30 -runs=10000

      - name: Run fuzz_css_parser
        run: cargo fuzz run fuzz_css_parser -- -max_total_time=30 -runs=10000

      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts/
          retention-days: 7

      - name: Check for crashes
        if: always()
        run: |
          if find fuzz/artifacts -name "crash-*" -o -name "leak-*" | grep -q .; then
            echo "::error::Fuzzing found crashes or memory leaks!"
            echo "Check uploaded artifacts for details."
            exit 1
          else
            echo "No crashes or memory leaks found."
          fi