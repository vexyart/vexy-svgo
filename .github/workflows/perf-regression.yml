name: Performance Regression Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  perf-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.74.0
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-perf-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install hyperfine
        run: |
          wget https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine_1.18.0_amd64.deb
      
      - name: Build current version (release)
        run: cargo build --release --package vexy-svgo-cli
      
      - name: Copy current binary
        run: cp target/release/vexy-svgo ./vexy-svgo-current
      
      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}
      
      - name: Build base version (release)
        if: github.event_name == 'pull_request'
        run: cargo build --release --package vexy-svgo-cli
      
      - name: Copy base binary
        if: github.event_name == 'pull_request'
        run: cp target/release/vexy-svgo ./vexy-svgo-base
      
      - name: Run performance benchmarks
        if: github.event_name == 'pull_request'
        run: |
          hyperfine --warmup 3 --runs 10 \
            --export-markdown perf-results.md \
            --export-json perf-results.json \
            './vexy-svgo-base testdata/test.svg -o /tmp/base-output.svg' \
            './vexy-svgo-current testdata/test.svg -o /tmp/current-output.svg'
      
      - name: Check for >5% regression
        if: github.event_name == 'pull_request'
        run: |
          python3 << 'EOF'
          import json
          import sys
          
          with open('perf-results.json') as f:
              results = json.load(f)
          
          base_time = results['results'][0]['mean']
          current_time = results['results'][1]['mean']
          
          regression_pct = ((current_time - base_time) / base_time) * 100
          
          print(f"Base time: {base_time:.4f}s")
          print(f"Current time: {current_time:.4f}s")
          print(f"Change: {regression_pct:+.2f}%")
          
          if regression_pct > 5.0:
              print(f"❌ PERFORMANCE REGRESSION DETECTED: {regression_pct:.2f}% slower")
              sys.exit(1)
          elif regression_pct < -5.0:
              print(f"✅ PERFORMANCE IMPROVEMENT: {-regression_pct:.2f}% faster")
          else:
              print(f"✅ Performance within acceptable range (±5%)")
          EOF
      
      - name: Upload performance results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            perf-results.md
            perf-results.json
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const markdown = fs.readFileSync('perf-results.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Performance Benchmark Results\n\n${markdown}\n\n**Threshold**: ±5% change triggers review`
            });
