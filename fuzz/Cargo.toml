[workspace]
members = ["."]

[package]
name = "vexy-svgo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vexy-svgo-core]
path = "../crates/core"

[[bin]]
name = "fuzz_svg_parser"
path = "fuzz_targets/fuzz_svg_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_path_parser"
path = "fuzz_targets/fuzz_path_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_css_parser"
path = "fuzz_targets/fuzz_css_parser.rs"
test = false
doc = false
bench = false
